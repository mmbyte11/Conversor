<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conversor de temperatura</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Conversor de temperatura</h1>
    <p>Escribe los grados Celsius y pulsa Convertir.</p>

    <label for="celsius">Grados Celsius (ºC)</label>
    <input type="number" id="celsius" step="any" placeholder="Ej.: 100">

    <button id="convertir">Convertir</button>

    <p id="resultado">El resultado aparecerá aquí.</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
